<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="t7 d7">
          <title id="t7">Human-in-the-Loop Approval Before Actions</title>
          <desc id="d7">Four-step horizontal flow: 1 Gather Details, 2 Preview Summary Card, 3 Human Clicks Approve, 4 Record Saved or Sent.</desc>
          <rect x="2" y="2" width="756" height="196" rx="12" fill="#faf6ea" stroke="#c1bcab" stroke-width="2"/>
          <text x="24" y="34" fill="#145756" font-family="Georgia,serif" font-size="20">The Safety Rule for Action Agents: Preview Before Writing</text>

          <rect x="24" y="56" width="160" height="118" rx="8" fill="#fffdf6" stroke="#145756" stroke-width="2"/>
          <text x="104" y="82" text-anchor="middle" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">STEP 1 · COLLECT</text>
          <text x="104" y="106" text-anchor="middle" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Ask Questions</text>
          <text x="104" y="128" text-anchor="middle" fill="#4d605c" font-family="system-ui,sans-serif" font-size="12">Date, department,</text>
          <text x="104" y="146" text-anchor="middle" fill="#4d605c" font-family="system-ui,sans-serif" font-size="12">guest count, lot</text>

          <path d="M188 115 H206" stroke="#8b571b" stroke-width="3"/>
          <rect x="210" y="56" width="160" height="118" rx="8" fill="#fffdf6" stroke="#145756" stroke-width="2"/>
          <text x="290" y="82" text-anchor="middle" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">STEP 2 · PREVIEW</text>
          <text x="290" y="106" text-anchor="middle" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Show Draft Card</text>
          <text x="290" y="128" text-anchor="middle" fill="#4d605c" font-family="system-ui,sans-serif" font-size="12">Display every field</text>
          <text x="290" y="146" text-anchor="middle" fill="#4d605c" font-family="system-ui,sans-serif" font-size="12">before saving</text>

          <path d="M374 115 H392" stroke="#8b571b" stroke-width="3"/>
          <rect x="396" y="56" width="160" height="118" rx="8" fill="#edf1e7" stroke="#8b571b" stroke-width="2.5"/>
          <text x="476" y="82" text-anchor="middle" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">STEP 3 · CONFIRM</text>
          <text x="476" y="106" text-anchor="middle" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Human Says Yes</text>
          <text x="476" y="128" text-anchor="middle" fill="#182c2d" font-family="system-ui,sans-serif" font-size="12">User checks dates</text>
          <text x="476" y="146" text-anchor="middle" fill="#182c2d" font-family="system-ui,sans-serif" font-size="12">and clicks Confirm</text>

          <path d="M560 115 H578" stroke="#8b571b" stroke-width="3"/>
          <rect x="582" y="56" width="154" height="118" rx="8" fill="#145756"/>
          <text x="659" y="82" text-anchor="middle" fill="#f2dfc4" font-family="system-ui,sans-serif" font-size="11" font-weight="700">STEP 4 · EXECUTE</text>
          <text x="659" y="106" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Run Action</text>
          <text x="659" y="128" text-anchor="middle" fill="#faf6ea" font-family="system-ui,sans-serif" font-size="12">Log row, post card,</text>
          <text x="659" y="146" text-anchor="middle" fill="#faf6ea" font-family="system-ui,sans-serif" font-size="12">return receipt ID</text>
        </svg>