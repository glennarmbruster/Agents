<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="t3 d3">
          <title id="t3">The Five Levels of Copilot Agents</title>
          <desc id="d3">Five rising steps: Level 1 Prompt Coach, Level 2 Handbook Q&amp;A, Level 3 Live Folder Tracker, Level 4 Action Agent, and Level 5 Multi-Agent Workflow.</desc>
          <rect x="2" y="2" width="756" height="276" rx="12" fill="#faf6ea" stroke="#c1bcab" stroke-width="2"/>
          <text x="24" y="34" fill="#145756" font-family="Georgia,serif" font-size="21">Your Agent Growth Ladder: Simple to Complex</text>

          <rect x="24" y="206" width="136" height="54" rx="6" fill="#fffdf6" stroke="#145756" stroke-width="2"/>
          <text x="34" y="227" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">LEVEL 1 · 5 MIN</text>
          <text x="34" y="246" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Prompt Coach</text>

          <rect x="168" y="168" width="136" height="92" rx="6" fill="#fffdf6" stroke="#145756" stroke-width="2"/>
          <text x="178" y="189" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">LEVEL 2 · 10 MIN</text>
          <text x="178" y="208" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Handbook Q&amp;A</text>
          <text x="178" y="228" fill="#4d605c" font-family="system-ui,sans-serif" font-size="11">1-3 uploaded files</text>
          <text x="178" y="244" fill="#4d605c" font-family="system-ui,sans-serif" font-size="11">Cites rule numbers</text>

          <rect x="312" y="130" width="136" height="130" rx="6" fill="#edf1e7" stroke="#145756" stroke-width="2"/>
          <text x="322" y="151" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">LEVEL 3 · 20 MIN</text>
          <text x="322" y="170" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Folder Grounded</text>
          <text x="322" y="190" fill="#182c2d" font-family="system-ui,sans-serif" font-size="11">Live SharePoint folder</text>
          <text x="322" y="208" fill="#182c2d" font-family="system-ui,sans-serif" font-size="11">Auto-updates when</text>
          <text x="322" y="224" fill="#182c2d" font-family="system-ui,sans-serif" font-size="11">files are edited</text>

          <rect x="456" y="92" width="136" height="168" rx="6" fill="#edf1e7" stroke="#8b571b" stroke-width="2"/>
          <text x="466" y="113" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">LEVEL 4 · STUDIO</text>
          <text x="466" y="132" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Action Agent</text>
          <text x="466" y="152" fill="#182c2d" font-family="system-ui,sans-serif" font-size="11">Asks intake questions</text>
          <text x="466" y="170" fill="#182c2d" font-family="system-ui,sans-serif" font-size="11">Logs rows to Excel</text>
          <text x="466" y="188" fill="#182c2d" font-family="system-ui,sans-serif" font-size="11">or sends Teams alerts</text>

          <rect x="600" y="54" width="136" height="206" rx="6" fill="#145756"/>
          <text x="610" y="75" fill="#f2dfc4" font-family="system-ui,sans-serif" font-size="11" font-weight="700">LEVEL 5 · TEAM</text>
          <text x="610" y="94" fill="#ffffff" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Team Workflow</text>
          <text x="610" y="116" fill="#faf6ea" font-family="system-ui,sans-serif" font-size="11">Triggers on new</text>
          <text x="610" y="132" fill="#faf6ea" font-family="system-ui,sans-serif" font-size="11">emails or forms</text>
          <text x="610" y="152" fill="#faf6ea" font-family="system-ui,sans-serif" font-size="11">Human approval</text>
          <text x="610" y="168" fill="#faf6ea" font-family="system-ui,sans-serif" font-size="11">before sending</text>
        </svg>