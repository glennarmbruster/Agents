<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="t1 d1">
      <title id="t1">Regular Chat vs. Parking &amp; Transit Agent</title>
      <desc id="d1">Comparison between Regular Copilot Chat and a Parking &amp; Transit Agent.</desc>
      <rect x="2" y="2" width="756" height="226" rx="12" fill="#faf6ea" stroke="#c1bcab" stroke-width="2"/>
      <rect x="24" y="24" width="335" height="182" rx="8" fill="#fffdf6" stroke="#8c9990" stroke-width="2"/>
      <text x="44" y="54" fill="#8b571b" font-family="system-ui,sans-serif" font-size="12" font-weight="700">REGULAR COPILOT CHAT</text>
      <text x="44" y="80" fill="#182c2d" font-family="Georgia,serif" font-size="20">Starts blank every shift</text>
      <text x="44" y="112" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13.5">• Re-type permit &amp; shuttle rules each morning</text>
      <text x="44" y="138" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13.5">• Re-upload the Parking Handbook PDF</text>
      <text x="44" y="164" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13.5">• Stuck in one dispatcher's private chat</text>
      <path d="M368 115 H394" stroke="#8b571b" stroke-width="4" stroke-linecap="round"/>
      <polygon points="392,107 406,115 392,123" fill="#8b571b"/>
      <rect x="410" y="24" width="326" height="182" rx="8" fill="#edf1e7" stroke="#145756" stroke-width="2.5"/>
      <text x="430" y="54" fill="#145756" font-family="system-ui,sans-serif" font-size="12" font-weight="700">PARKING &amp; TRANSIT AGENT</text>
      <text x="430" y="80" fill="#182c2d" font-family="Georgia,serif" font-size="20">Saved rules + files + team link</text>
      <text x="430" y="112" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13.5">• Knows Rule VP-01 to EV-02 automatically</text>
      <text x="430" y="138" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13.5">• Reads live SharePoint lot &amp; shuttle docs</text>
      <text x="430" y="164" fill="#182c2d" font-family="system-ui,sans-serif" font-size="13.5">• Pinned in Teams for Booth, Dispatch &amp; Office</text>
    </svg>