<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="t10 d10">
      <title id="t10">Shuttle Headway &amp; ADA Lift SLA Escalation</title>
      <desc id="d10">Shuttle schedule rules and 20-minute ADA backup van SLA.</desc>
      <rect x="2" y="2" width="756" height="196" rx="12" fill="#faf6ea" stroke="#c1bcab" stroke-width="2"/>
      <text x="24" y="34" fill="#145756" font-family="Georgia,serif" font-size="20">Shuttle Headways &amp; 20-Minute ADA Backup Rule (Rules SH-01 to SH-03)</text>
      <rect x="24" y="54" width="224" height="122" rx="8" fill="#fffdf6" stroke="#145756" stroke-width="2"/>
      <text x="38" y="80" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">MON–FRI LOOP (SH-01)</text>
      <text x="38" y="104" fill="#182c2d" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Every 15 Minutes</text>
      <text x="38" y="128" fill="#4d605c" font-family="system-ui,sans-serif" font-size="12.5">6:30 a.m. – 9:00 p.m.</text>
      <text x="38" y="150" fill="#145756" font-family="system-ui,sans-serif" font-size="12">All buses ADA lift-equipped</text>

      <rect x="268" y="54" width="224" height="122" rx="8" fill="#fffdf6" stroke="#145756" stroke-width="2"/>
      <text x="282" y="80" fill="#8b571b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">WEEKEND SERVICE (SH-02)</text>
      <text x="282" y="104" fill="#182c2d" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Saturday Only · 30 Min</text>
      <text x="282" y="128" fill="#4d605c" font-family="system-ui,sans-serif" font-size="12.5">9:00 a.m. – 5:00 p.m.</text>
      <text x="282" y="150" fill="#8b571b" font-family="system-ui,sans-serif" font-size="12" font-weight="600">No Sunday Shuttle</text>

      <rect x="512" y="54" width="224" height="122" rx="8" fill="#145756"/>
      <text x="526" y="80" fill="#f2dfc4" font-family="system-ui,sans-serif" font-size="11" font-weight="700">ADA LIFT OUTAGE (SH-03)</text>
      <text x="526" y="104" fill="#ffffff" font-family="system-ui,sans-serif" font-size="14" font-weight="700">20-Minute Backup Van</text>
      <text x="526" y="128" fill="#faf6ea" font-family="system-ui,sans-serif" font-size="12.5">Agent flags urgent dispatch</text>
      <text x="526" y="150" fill="#f2dfc4" font-family="system-ui,sans-serif" font-size="12">&amp; logs repeat bus faults</text>
    </svg>